name: Mirror to Gitea
on:
  workflow_call:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret integrity
        env:
          T: ${{ secrets.GITEA_TOKEN }}
        run: |
          echo "length=${#T}"
          echo "sha=$(printf '%s' "$T" | sha256sum | cut -c1-12)"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push to Gitea
        run: |
          git remote add gitea https://oauth2:${{ secrets.GITEA_TOKEN }}@git.almaroo.work/almaroo/${{ github.event.repository.name }}.git
          git push gitea --tags HEAD:master
